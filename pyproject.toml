[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collective-alpha"
version = "1.0.0"
description = "Korean equity research MCP and paper trading engine"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mcp[cli]>=1.2,<2", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
collective-alpha-mcp = "collective_alpha.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
